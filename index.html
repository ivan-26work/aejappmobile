<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>AEJ • Authentification</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff7e9f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AEJ">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <!-- LOADER INITIAL -->
  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <div class="loading-title">AEJ</div>
    </div>
  </div>

  <!-- CONTENU PRINCIPAL -->
  <main class="main-content">
    <div class="auth-container">
      <!-- Logo -->
      <div class="logo-container">
        <div class="logo-circle">
          <img src="assets/logo.png" alt="AEJ" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'45\' fill=\'url(%23g)\'/%3E%3Cdefs%3E%3ClinearGradient id=\'g\' x1=\'0%25\' y1=\'0%25\' x2=\'100%25\' y2=\'100%25\'%3E%3Cstop offset=\'0%25\' stop-color=\'%234a90e2\'/%3E%3Cstop offset=\'100%25\' stop-color=\'%23ff7e9f\'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x=\'50\' y=\'70\' font-size=\'40\' text-anchor=\'middle\' fill=\'white\' font-family=\'Arial\'%3EAEJ%3C/text%3E%3C/svg%3E';">
        </div>
        <h1>AEJ</h1>
        <p>Administration</p>
      </div>

      <!-- Carte de connexion -->
      <div class="auth-card">
        <h2>Connexion</h2>
        
        <form id="loginForm" novalidate>
          <div class="form-group">
            <div class="input-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="email" placeholder="Email" required autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <div class="input-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
            </div>
            <button type="button" class="toggle-password" id="togglePassword" tabindex="-1">
              <i class="fas fa-eye"></i>
            </button>
          </div>

          <div class="form-group">
            <div class="input-icon">
              <i class="fas fa-key"></i>
              <input type="text" id="codeSecret" placeholder="Code secret" required>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="btnLogin">
            <i class="fas fa-arrow-right"></i> Se connecter
          </button>
        </form>

        <div class="auth-footer">
          <a href="#" id="forgotPassword">Mot de passe oublié ?</a>
        </div>
      </div>
    </div>
  </main>

  <!-- MODALE RÉINITIALISATION -->
  <div class="modal hidden" id="forgotModal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h3>Réinitialisation</h3>
      <p>Entrez votre email et le code secret</p>
      <div class="form-group">
        <div class="input-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="resetEmail" placeholder="Email">
        </div>
      </div>
      <div class="form-group">
        <div class="input-icon">
          <i class="fas fa-key"></i>
          <input type="text" id="resetCodeSecret" placeholder="Code secret">
        </div>
      </div>
      <div class="modal-buttons">
        <button class="btn-modal btn-cancel" id="cancelReset">Annuler</button>
        <button class="btn-modal btn-send" id="sendReset">Envoyer</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
</body>
</html>
